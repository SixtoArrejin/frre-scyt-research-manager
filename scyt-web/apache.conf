ServerName localhost

# DocumentRoot
DocumentRoot "/usr/local/apache2/htdocs"

<Directory "/usr/local/apache2/htdocs">
    Options -Indexes
    AllowOverride None
    Require all granted

    # SPA fallback: si no existe el archivo, sirve index.html
    <IfModule mod_rewrite.c>
        RewriteEngine On

        # Si existe archivo o carpeta, servirlo normalmente
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        # Si parece un archivo (tiene extensión), no aplicar fallback (dejar 404 si no existe)
        RewriteCond %{REQUEST_URI} \.\w+$ [NC]
        RewriteRule ^ - [L]

        # Si NO existe, mandar a index.html (React Router)
        RewriteRule ^ /index.html [L]
    </IfModule>
</Directory>

# Tip: cachear assets (opcional)
<IfModule mod_headers.c>
    <FilesMatch "\.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$">
        Header set Cache-Control "public, max-age=2592000, immutable"
    </FilesMatch>
    <FilesMatch "^index\.html$">
        Header set Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate"
    </FilesMatch>
</IfModule>
