services:
  api:
    build:
      context: ./scyt-api
    env_file:
      - ./scyt-api/.env
    environment:
      - PORT=8000
    ports:
      - "8001:8000"

  web:
    build:
      context: ./scyt-web
      dockerfile: Dockerfile.nginx
      args:
        VITE_API_BASE_URL: "http://localhost:8001"
    depends_on:
      - api
    ports:
      - "8080:80"
